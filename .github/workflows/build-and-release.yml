name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      apk_path: ${{ steps.build_apk.outputs.apk_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          build-tools-version: '34.0.0'
          cmdline-tools-version: 'latest'
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Extract version from gradle.properties
        id: extract_version
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | cut -d'=' -f2)
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build Debug APK
        id: build_debug
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Build Release APK
        id: build_release
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MummyFlix-debug-${{ steps.extract_version.outputs.version }}
          path: ${{ steps.build_debug.outputs.apk_path }}
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MummyFlix-release-${{ steps.extract_version.outputs.version }}
          path: ${{ steps.build_release.outputs.apk_path }}
          retention-days: 90

      - name: Run Lint
        run: ./gradlew lint --no-daemon

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

  semantic-release:
    name: Semantic Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/git @semantic-release/github @semantic-release/changelog @semantic-release/exec conventional-changelog-conventionalcommits

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release \
            --branches main \
            --plugins \
              @semantic-release/commit-analyzer \
              @semantic-release/release-notes-generator \
              @semantic-release/changelog \
              @semantic-release/github \
              @semantic-release/git \
              @semantic-release/exec

  release-apk:
    name: Release APK to GitHub
    needs: [build, semantic-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: MummyFlix-release-${{ needs.build.outputs.version }}
          path: ./apk

      - name: Rename APK
        run: |
          mv ./apk/*.apk ./MummyFlix-${{ needs.build.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MummyFlix ${{ needs.build.outputs.version }}
          body: |
            ## MummyFlix ${{ needs.build.outputs.version }}
            
            ### Features
            - Live TV streaming with HLS support
            - Radio mode with audio visualization
            - Auto-scan for channels
            - Program guide with favorites and locks
            - Built-in Snake game
            - Full Fire TV remote support (D-Pad, OK, Back, Menu, Info, Numeric keys)
            - Channel banner with info
            - Numeric channel input
            
            ### Branding
            - **App Name**: MummyFlix
            - **Developed by**: Sanchit
            - **Logo**: Custom MummyFlix logo
            
            ### Compatibility
            - Android TV / Fire TV Stick (API 21+)
            - Optimized for leanback launcher
            - Hardware accelerated video playback via ExoPlayer
          files: ./MummyFlix-${{ needs.build.outputs.version }}.apk
          draft: false
          prerelease: false

  notify:
    name: Notify on Failure
    needs: [build, semantic-release, release-apk]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "Build or release failed for ${{ github.repository }}@${{ github.sha }}"
          echo "Check GitHub Actions for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"